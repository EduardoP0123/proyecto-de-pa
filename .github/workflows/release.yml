name: Release v3 (Windows + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Git tag para el release (ej. v3.0)"
        required: true
        default: "v3.0"
      app_name:
        description: "Nombre del app (ej. KV2C & KV2A ANALYZER v 3.0)"
        required: false
        default: "KV2C & KV2A ANALYZER v 3.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove stale spec files
        shell: bash
        run: find . -name "*.spec" -delete || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute names
        shell: powershell
        run: |
          $APP_NAME = "${{ github.event.inputs.app_name }}"
          if ([string]::IsNullOrWhiteSpace($APP_NAME)) { $APP_NAME = "KV2C & KV2A ANALYZER v 3.0" }
          $SAFE_NAME = ($APP_NAME -replace '[^A-Za-z0-9._-]', '_')
          echo "APP_NAME=$APP_NAME" >> $env:GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe with PyInstaller
        shell: powershell
        run: |
          $addData = @()
          if (Test-Path 'ui\images') { $addData += @('--add-data', 'ui\images;ui\images') }
          if (Test-Path 'config')    { $addData += @('--add-data', 'config;config') }
          $pyArgs = @(
            '-m', 'PyInstaller',
            '--noconfirm', '--clean',
            '--windowed', '--onefile',
            '--name', "$env:SAFE_NAME",
            '--hidden-import', 'tkcalendar',
            '--hidden-import', 'openpyxl',
            '--hidden-import', 'babel.numbers'
          ) + $addData + @('run_app.py')
          & python $pyArgs

      - name: Zip exe
        shell: powershell
        run: |
          Compress-Archive -Path "dist\$env:SAFE_NAME.exe" `
            -DestinationPath "dist\$env:SAFE_NAME-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}-windows
          path: dist/${{ env.SAFE_NAME }}-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove stale spec files
        run: find . -name "*.spec" -delete || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute names
        run: |
          APP_NAME='${{ github.event.inputs.app_name }}'
          if [ -z "$APP_NAME" ]; then APP_NAME='KV2C & KV2A ANALYZER v 3.0'; fi
          SAFE_NAME=$(echo "$APP_NAME" | sed -E 's/[^A-Za-z0-9._-]/_/g')
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "SAFE_NAME=$SAFE_NAME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          ADD_DATA=""
          [ -d "ui/images" ] && ADD_DATA="$ADD_DATA --add-data ui/images:ui/images"
          [ -d "config" ]    && ADD_DATA="$ADD_DATA --add-data config:config"
          pyinstaller \
            --noconfirm --clean \
            --windowed \
            --name "$SAFE_NAME" \
            --hidden-import tkcalendar \
            --hidden-import openpyxl \
            --hidden-import babel.numbers \
            $ADD_DATA \
            run_app.py

      - name: Zip .app bundle
        run: |
          cd dist
          zip -r "$SAFE_NAME-mac.zip" "$SAFE_NAME.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}-mac
          path: dist/${{ env.SAFE_NAME }}-mac.zip

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - name: Compute names
        run: |
          APP_NAME='${{ github.event.inputs.app_name }}'
          if [ -z "$APP_NAME" ]; then APP_NAME='KV2C & KV2A ANALYZER v 3.0'; fi
          SAFE_NAME=$(echo "$APP_NAME" | sed -E 's/[^A-Za-z0-9._-]/_/g')
          echo "APP_NAME=$APP_NAME"   >> "$GITHUB_ENV"
          echo "SAFE_NAME=$SAFE_NAME" >> "$GITHUB_ENV"

      - name: Determine tag
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          if [ -z "$TAG" ]; then TAG="$GITHUB_REF_NAME"; fi
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}-windows
          path: release/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}-mac
          path: release/macos

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: "${{ env.TAG_NAME }} — ${{ env.APP_NAME }}"
          body: |
            ## KV2C & KV2A ANALYZER v3.0

            ### Novedades v3.0
            - ✅ Multipliers por empresa aplicados automáticamente (60 empresas ZFSI)
            - ✅ Corrección de parsing de fechas D/M/Y para archivos 2026
            - ✅ Detección de canal KWh/KVARh desde sub-encabezado del CSV
            - ✅ Eliminación robusta de fila de sub-encabezado en CSVs
            - ✅ Sistema de overrides: el usuario puede cambiar multiplos sin perder los defaults

            ### Descargas
            - **Windows**: descarga el `.zip`, extrae y ejecuta el `.exe`
            - **macOS**: descarga el `.zip`, extrae y abre el `.app`
          draft: false
          prerelease: false
          files: |
            release/windows/${{ env.SAFE_NAME }}-windows.zip
            release/macos/${{ env.SAFE_NAME }}-mac.zip
